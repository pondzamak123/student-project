<!DOCTYPE html>
<html lang="th">
<head>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Inter:wght@300;400;500&display=swap');
      * { margin: 0; padding: 0; box-sizing: border-box; }
      .slide-container { width: 1280px; min-height: 720px; box-sizing: border-box; background: #E8EAF6; position: relative; overflow: hidden; font-family: 'Inter', sans-serif; }
      .circle-accent-1 { position: absolute; width: 500px; height: 500px; border-radius: 50%; background: #FFC107; top: -100px; left: -80px; opacity: 0.9; }
      .circle-accent-2 { position: absolute; width: 300px; height: 300px; border-radius: 50%; background: #3949AB; top: 200px; left: 180px; opacity: 0.15; }
      .circle-accent-3 { position: absolute; width: 150px; height: 150px; border-radius: 50%; background: #1A237E; bottom: 100px; left: 100px; opacity: 0.1; }
      .content-block { position: absolute; right: 60px; bottom: 120px; max-width: 680px; }
      .main-title { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; font-size: 52px; color: #1A237E; line-height: 1.15; margin-bottom: 20px; }
      .subtitle { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 24px; color: #3949AB; margin-bottom: 40px; line-height: 1.5; }
      .footer-bar { position: absolute; right: 60px; bottom: 50px; font-family: 'Inter', sans-serif; font-weight: 300; font-size: 14px; color: #3949AB; opacity: 0.7; }
      .footer-bar i { color: #FFC107; margin-right: 6px; }
      .icon-circle { position: absolute; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,193,7,0.2); display: flex; align-items: center; justify-content: center; font-size: 32px; color: #1A237E; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="circle-accent-1"></div>
        <div class="circle-accent-2"></div>
        <div class="circle-accent-3"></div>
        <div class="content-block">
            <div class="main-title">Student Project<br>Tracking Dashboard</div>
            <div class="subtitle">ระบบติดตามความคืบหน้าโครงงานนักศึกษา</div>
        </div>
        <div class="footer-bar">
            <i class="fas fa-code"></i> Full-Stack Web Application &nbsp;|&nbsp; Node.js + Express + MongoDB + MySQL
        </div>
    </div>
</body>
</html>
