<!DOCTYPE html>
<html lang="th">
<head>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Inter:wght@300;400;500;600&display=swap');
      * { margin: 0; padding: 0; box-sizing: border-box; }
      .slide-container { width: 1280px; min-height: 720px; box-sizing: border-box; background: #E8EAF6; position: relative; overflow: hidden; font-family: 'Inter', sans-serif; }
      
      /* Background Decorative Elements */
      .circle-accent-1 { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: #FFC107; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.15; }
      .circle-accent-2 { position: absolute; width: 400px; height: 400px; border-radius: 50%; background: #1A237E; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.08; }
      
      /* Content Container */
      .content-block { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 800px; text-align: center; }
      
      /* Typography */
      .slide-title { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; font-size: 42px; color: #1A237E; margin-bottom: 15px; }
      .slide-subtitle { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 20px; color: #3949AB; margin-bottom: 50px; }
      
      /* Summary List */
      .summary-list { display: flex; flex-direction: column; gap: 24px; text-align: left; max-width: 700px; margin: 0 auto; }
      .summary-item { display: flex; align-items: center; background: rgba(255, 255, 255, 0.6); padding: 16px 24px; }
      .check-icon { min-width: 40px; height: 40px; border-radius: 50%; background: #1A237E; display: flex; align-items: center; justify-content: center; color: #FFC107; font-size: 18px; margin-right: 20px; }
      .summary-text { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 22px; color: #1A237E; line-height: 1.4; }
      .summary-text strong { font-weight: 500; }
      
      /* Final Action */
      .action-box { margin-top: 40px; display: inline-block; padding: 12px 30px; background: #1A237E; color: #FFC107; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 18px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="circle-accent-1"></div>
        <div class="circle-accent-2"></div>
        
        <div class="content-block">
            <div class="slide-title">Student Project Tracking Dashboard<br>เสร็จสมบูรณ์</div>
            <div class="slide-subtitle">สรุปความเรียบร้อยของระบบ</div>
            
            <div class="summary-list">
                <div class="summary-item">
                    <div class="check-icon"><i class="fas fa-check"></i></div>
                    <div class="summary-text"><strong>Frontend + Backend + 2 Databases</strong> ทำงานครบถ้วนสมบูรณ์</div>
                </div>
                <div class="summary-item">
                    <div class="check-icon"><i class="fas fa-check"></i></div>
                    <div class="summary-text"><strong>RESTful API + Validation + JWT + RBAC</strong> พร้อมความปลอดภัย</div>
                </div>
                <div class="summary-item">
                    <div class="check-icon"><i class="fas fa-check"></i></div>
                    <div class="summary-text"><strong>Swagger API Docs + Postman Collection</strong> พร้อมใช้งานทันที</div>
                </div>
            </div>
            
            <div class="action-box">
                npm install &rarr; npm run dev &rarr; ใช้งานได้ทันที
            </div>
        </div>
    </div>
</body>
</html>
